<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --tx:#1d1d1b; --mut:#6b6b66; --ac:#1f5f4a; --bd:#e2dfd6; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:var(--card); border-bottom:1px solid var(--bd); position:sticky; top:0; }
  header h1 { margin:0; font-size:20px; cursor:pointer; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 14px; background:var(--ac); color:#fff; }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--ac); }
  button:disabled { background:#c9c7bf; cursor:not-allowed; }
  main { max-width:900px; margin:0 auto; padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .emoji { font-size:56px; text-align:center; }
  .preco { font-weight:700; }
  .mut { color:var(--mut); font-size:14px; }
  .err { color:var(--err); }
  .linha { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bd); gap:10px; }
  .qtd button { padding:4px 10px; }
  .grande { font-size:96px; text-align:center; }
  .ok { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:24px; text-align:center; }
  a.voltar { color:var(--ac); cursor:pointer; display:inline-block; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1 onclick="irCatalogo()">🛍️ Loja</h1>
  <button class="sec" onclick="irSacola()">Sacola (<span id="cnt">0</span>)</button>
</header>
<main id="app"></main>

<script>
// >>> TROQUE pelo endereço da sua API no Render (sem barra no final) <<<
const API = "http://localhost:3000";

let produtos = [];
let sacola = []; // [{ id, quantidade }]
const app = document.getElementById("app");
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function atualizaContador() {
  document.getElementById("cnt").textContent = sacola.reduce((s, i) => s + i.quantidade, 0);
}

async function irCatalogo() {
  app.innerHTML = "<p>Carregando...</p>";
  try {
    const r = await fetch(API + "/produtos");
    produtos = await r.json();
  } catch (e) {
    app.innerHTML = '<p class="err">Não foi possível conectar à API. Se estiver no Render grátis, aguarde ~1 minuto e recarregue.</p>';
    return;
  }
  app.innerHTML = '<div class="grid">' + produtos.map((p) => `
    <div class="card">
      <div class="emoji">${p.emoji}</div>
      <strong>${p.nome}</strong>
      <span class="preco">${brl(p.preco)}</span>
      <span class="mut ${p.estoque === 0 ? "err" : ""}">${p.estoque === 0 ? "Sem estoque" : p.estoque + " em estoque"}</span>
      <button class="sec" onclick="irDetalhe(${p.id})">Ver detalhes</button>
    </div>`).join("") + "</div>";
}

async function irDetalhe(id) {
  const r = await fetch(API + "/produtos/" + id);
  const p = await r.json();
  app.innerHTML = `
    <a class="voltar" onclick="irCatalogo()">← Voltar</a>
    <div class="card">
      <div class="grande">${p.emoji}</div>
      <h2 style="margin:0">${p.nome}</h2>
      <p class="mut">${p.descricao}</p>
      <span class="preco">${brl(p.preco)}</span>
      <span class="mut ${p.estoque === 0 ? "err" : ""}">${p.estoque === 0 ? "Sem estoque" : p.estoque + " em estoque"}</span>
      <button ${p.estoque === 0 ? "disabled" : ""} onclick="adicionar(${p.id}, ${p.estoque})">
        ${p.estoque === 0 ? "Indisponível" : "Adicionar à sacola"}
      </button>
    </div>`;
}

function adicionar(id, estoque) {
  const item = sacola.find((i) => i.id === id);
  if (item) {
    if (item.quantidade < estoque) item.quantidade++;
  } else sacola.push({ id, quantidade: 1 });
  atualizaContador();
  irSacola();
}

function mudar(id, delta) {
  const item = sacola.find((i) => i.id === id);
  item.quantidade += delta;
  if (item.quantidade <= 0) sacola = sacola.filter((i) => i.id !== id);
  atualizaContador();
  irSacola();
}

function irSacola(erro) {
  if (sacola.length === 0) {
    app.innerHTML = '<a class="voltar" onclick="irCatalogo()">← Voltar</a><p>Sua sacola está vazia.</p>';
    return;
  }
  let total = 0;
  const linhas = sacola.map((i) => {
    const p = produtos.find((x) => x.id === i.id);
    total += p.preco * i.quantidade;
    return `<div class="linha">
      <span>${p.emoji} ${p.nome}</span>
      <span class="qtd"><button onclick="mudar(${p.id},-1)">−</button> ${i.quantidade} <button onclick="mudar(${p.id},1)">+</button></span>
      <span>${brl(p.preco * i.quantidade)}</span>
    </div>`;
  }).join("");
  app.innerHTML = `
    <a class="voltar" onclick="irCatalogo()">← Continuar comprando</a>
    <div class="card">${linhas}
      <div class="linha"><strong>Total</strong><strong>${brl(total)}</strong></div>
      ${erro ? `<p class="err">${erro}</p>` : ""}
      <button onclick="finalizar()">Finalizar compra</button>
    </div>`;
}

async function finalizar() {
  const r = await fetch(API + "/comprar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ itens: sacola.map((i) => ({ id: i.id, quantidade: i.quantidade })) }),
  });
  const dados = await r.json();
  if (!r.ok) return irSacola(dados.erro);
  sacola = [];
  atualizaContador();
  app.innerHTML = `<div class="ok">
    <div class="grande">✅</div>
    <h2>Compra finalizada!</h2>
    <p>Número do pedido: <strong>#${dados.pedido}</strong></p>
    <p>Total: <strong>${brl(dados.total)}</strong></p>
    <button onclick="irCatalogo()">Voltar à loja</button>
  </div>`;
}

async function resetar() {
  await fetch(API + "/resetar", { method: "POST" });
  sacola = [];
  atualizaContador();
  irCatalogo();
}

irCatalogo();
</script>
<div style="text-align:center;padding:20px">
  <button class="sec" onclick="resetar()">Resetar estoques (demo)</button>
</div>
</body>
</html>
